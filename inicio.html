<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inicio | Loreto Ingeniería</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- Librería para las gráficas del Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-blue: #263fa4; --light-blue: #eef2ff; --bg-color: #f8fafc;
            --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --success: #10b981; --warning: #f59e0b; --danger: #dc2626;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-initial { width: 35px; height: 35px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .sidebar { position: fixed; height: calc(100vh - 60px); transform: translateX(-100%); z-index: 40; } .sidebar.open { transform: translateX(0); } .header-title { display: none; } }

        .sidebar-nav { padding: 15px 10px; }
        .sidebar-section { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .sidebar-section:last-child { border-bottom: none; }
        .sidebar .section-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin: 10px 15px; display: block; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 15px; color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 8px; margin-bottom: 2px; transition: all 0.2s; }
        .nav-item:hover { background-color: var(--bg-color); }
        .nav-item.active { background-color: var(--light-blue); color: var(--primary-blue); font-weight: 700; border-left: 4px solid var(--primary-blue); }
        .nav-item.active i { color: var(--primary-blue); }

        .content { flex: 1; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .container { max-width: 1200px; margin: 0 auto; padding-bottom: 50px; }
        
        .welcome-banner { 
            background: linear-gradient(135deg, var(--primary-blue 0%), #1a2a6e 100%);
            background-color: var(--primary-blue); 
            color: white; padding: 30px; border-radius: 16px; margin-bottom: 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 12px rgba(38, 63, 164, 0.2);
        }
        .welcome-banner h1 { margin: 0; font-size: 28px; font-weight: 800; }
        .welcome-banner p { margin: 5px 0 0 0; font-size: 16px; opacity: 0.9; }
        .welcome-icon { font-size: 64px; opacity: 0.2; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-info h3 { margin: 0; font-size: 24px; color: var(--text-main); }
        .stat-info p { margin: 0; font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }

        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
        
        .chart-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); }
        .chart-card h3 { margin: 0 0 15px 0; font-size: 16px; color: var(--text-main); font-weight: 700; }
        .chart-wrapper { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <img src="https://i.ibb.co/mC4fV6TG/LOGOTIPO-2.jpg" alt="Logo" style="height: 35px; object-fit: contain;">
            <h1 class="header-title">PANEL PRINCIPAL</h1>
        </div>
        <div class="header-right">
            <div class="user-initial" id="user-initial">U</div>
            <img src="https://i.ibb.co/KcRX1LNZ/LOGOTIPO1.png" alt="User" height="35" style="border-radius:4px;">
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="container">
                <!-- Banner de Bienvenida -->
                <div class="welcome-banner">
                    <div>
                        <h1>¡Bienvenido, <span id="user-name">Usuario</span>! 👋</h1>
                        <p>Resumen general del sistema de gestión de enfermería.</p>
                    </div>
                    <i data-lucide="activity" class="welcome-icon"></i>
                </div>

                <!-- Tarjetas de Estadísticas (Inventadas) -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #dcfce7; color: var(--success);"><i data-lucide="user-check"></i></div>
                        <div class="stat-info">
                            <h3>128</h3>
                            <p>Personal Activo</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #fef3c7; color: var(--warning);"><i data-lucide="calendar-clock"></i></div>
                        <div class="stat-info">
                            <h3>34</h3>
                            <p>Vacaciones Programadas</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #fee2e2; color: var(--danger);"><i data-lucide="bed"></i></div>
                        <div class="stat-info">
                            <h3>5</h3>
                            <p>Incapacidades</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: var(--light-blue); color: var(--primary-blue);"><i data-lucide="file-text"></i></div>
                        <div class="stat-info">
                            <h3>12</h3>
                            <p>Kardex Pendientes</p>
                        </div>
                    </div>
                </div>

                <!-- Gráficas del Dashboard (Inventadas) -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>Distribución de Turnos</h3>
                        <div class="chart-wrapper">
                            <canvas id="chartTurnos"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3>Estatus de Kardex</h3>
                        <div class="chart-wrapper">
                            <canvas id="chartKardex"></canvas>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Obtener el nombre del usuario del localStorage
        const nombreUsuario = localStorage.getItem('nombre') || 'Usuario';
        document.getElementById('user-name').innerText = nombreUsuario;
        document.getElementById('user-initial').innerText = nombreUsuario.charAt(0).toUpperCase();

        // Cargar Menú
        fetch('menu.html').then(res => res.text()).then(html => {
            document.getElementById('sidebar').innerHTML = html;
            lucide.createIcons();
            // Resaltar el botón de Inicio
            const linkInicio = document.getElementById('link-inicio'); 
            if(linkInicio) linkInicio.classList.add('active');
        });

        // Toggle menú móvil
        document.getElementById('toggle-menu').addEventListener('click', () => { 
            document.getElementById('sidebar').classList.toggle('open'); 
        });

        // Configuración de Gráficas (Chart.js)
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Gráfica de Barras
            const ctxTurnos = document.getElementById('chartTurnos').getContext('2d');
            new Chart(ctxTurnos, {
                type: 'bar',
                data: {
                    labels: ['Matutino', 'Vespertino', 'Nocturno'],
                    datasets: [{
                        label: 'Número de Empleados',
                        data: [55, 43, 30],
                        backgroundColor: ['#263fa4', '#10b981', '#f59e0b'],
                        borderRadius: 8,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });

            // Gráfica de Dona (Doughnut)
            const ctxKardex = document.getElementById('chartKardex').getContext('2d');
            new Chart(ctxKardex, {
                type: 'doughnut',
                data: {
                    labels: ['Completados', 'Pendientes', 'Borradores'],
                    datasets: [{
                        data: [85, 12, 5],
                        backgroundColor: ['#10b981', '#f59e0b', '#e2e8f0'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20, font: { size: 12 } } }
                    }
                }
            });
        });
    </script>
</body>
</html>
